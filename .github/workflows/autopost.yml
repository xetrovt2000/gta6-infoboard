name: Autopost (Bluesky + Discord)

on:
  push:
    branches: [main]
    paths: [feed.xml]
  workflow_dispatch:

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Neue Meldungen posten
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DISCORD_WEBHOOK_LEONIDA: ${{ secrets.DISCORD_WEBHOOK_LEONIDA }}
        run: python tools/autopost.py
      - name: Stand speichern
        run: |
          if ! git diff --quiet tools/autopost_posted.json; then
            git config user.name "Leonida Autopost"
            git config user.email "xetrovt2000@users.noreply.github.com"
            git add tools/autopost_posted.json
            git commit -m "Autopost: Stand [skip ci]"
            git pull --rebase
            git push
          fi
